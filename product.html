<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細 | DEMO STORE</title>
  <!-- ★ GTM head snippet here -->
  <style>
    :root {
      --primary: #1a1a2e;
      --accent: #e94560;
      --bg: #f8f7f4;
      --card-bg: #ffffff;
      --text: #2d2d2d;
      --text-light: #6b6b6b;
      --border: #e8e6e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    header { background: var(--primary); color: #fff; padding: 20px 0; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
    header .container { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    .logo span { color: var(--accent); }
    nav a { color: #ccc; text-decoration: none; margin-left: 24px; font-size: 14px; }
    nav a:hover { color: #fff; }
    footer { background: var(--primary); color: #888; padding: 32px 0; text-align: center; font-size: 13px; }

    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 60px 0; align-items: start; }
    @media (max-width: 640px) { .product-detail { grid-template-columns: 1fr; } }
    .product-image { background: #e9ecef; border-radius: 12px; height: 360px; display: flex; align-items: center; justify-content: center; font-size: 80px; color: #adb5bd; }
    .product-meta h1 { font-size: 28px; margin-bottom: 12px; }
    .product-meta .price { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: 20px; }
    .product-meta p { color: var(--text-light); margin-bottom: 24px; font-size: 15px; }
    .btn { display: inline-block; background: var(--accent); color: #fff; padding: 14px 36px; border-radius: 6px; text-decoration: none; font-size: 15px; font-weight: 600; border: none; cursor: pointer; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-cart { background: var(--primary); margin-left: 12px; }

    .section { padding: 60px 0; }
    .section-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    table th { background: #f0f0ed; font-weight: 600; width: 30%; }

    .breadcrumb { padding: 16px 0; font-size: 13px; color: var(--text-light); }
    .breadcrumb a { color: var(--text-light); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
  </style>
  <script>window.dataLayer = window.dataLayer || [];</script>
</head>
<body>
  <!-- ★ GTM body snippet here -->

  <header>
    <div class="container">
      <div class="logo">DEMO<span>STORE</span></div>
      <nav>
        <a href="index.html">ホーム</a>
        <a href="product.html">商品一覧</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">ホーム</a> &gt; <a href="product.html">商品一覧</a> &gt; サンプル商品 A
    </div>
  </div>

  <div class="container">
    <div class="product-detail">
      <div class="product-image">📦</div>
      <div class="product-meta">
        <h1 id="product-name">サンプル商品 A</h1>
        <div class="price" id="product-price">¥3,980<span style="font-size:14px; color:#999; font-weight:400;">（税込）</span></div>
        <p>これはGA4のeコマースイベント（view_item, add_to_cart, begin_checkout, purchase）を練習するためのダミー商品です。下のボタンをクリックしてdataLayerのイベントを確認してみてください。</p>

        <!-- ★ eコマースイベント練習ボタン -->
        <button class="btn" id="btn-add-cart" onclick="addToCart()">カートに追加</button>
        <button class="btn btn-cart" id="btn-checkout" onclick="beginCheckout()">購入手続きへ</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section">
      <h2 class="section-title">商品スペック</h2>
      <table>
        <tr><th>商品名</th><td>サンプル商品 A</td></tr>
        <tr><th>カテゴリ</th><td>サンプルカテゴリ</td></tr>
        <tr><th>価格</th><td>¥3,980</td></tr>
        <tr><th>在庫</th><td>あり</td></tr>
        <tr><th>送料</th><td>無料</td></tr>
      </table>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 DEMO STORE — GA4/GTM練習用サイト</p>
    </div>
  </footer>

  <script>
    // ★ ページ表示時に view_item イベントを発火
    dataLayer.push({
      'event': 'view_item',
      'ecommerce': {
        'items': [{
          'item_id': 'SAMPLE-A',
          'item_name': 'サンプル商品 A',
          'item_category': 'サンプルカテゴリ',
          'price': 3980,
          'currency': 'JPY',
          'quantity': 1
        }]
      }
    });

    // ★ add_to_cart イベント
    function addToCart() {
      dataLayer.push({ 'ecommerce': null }); // 前のecommerceをクリア
      dataLayer.push({
        'event': 'add_to_cart',
        'ecommerce': {
          'items': [{
            'item_id': 'SAMPLE-A',
            'item_name': 'サンプル商品 A',
            'item_category': 'サンプルカテゴリ',
            'price': 3980,
            'currency': 'JPY',
            'quantity': 1
          }]
        }
      });
      alert('add_to_cart イベントを発火しました！\nGTMプレビューモードで確認してください');
    }

    // ★ begin_checkout イベント
    function beginCheckout() {
      dataLayer.push({ 'ecommerce': null });
      dataLayer.push({
        'event': 'begin_checkout',
        'ecommerce': {
          'items': [{
            'item_id': 'SAMPLE-A',
            'item_name': 'サンプル商品 A',
            'item_category': 'サンプルカテゴリ',
            'price': 3980,
            'currency': 'JPY',
            'quantity': 1
          }]
        }
      });
      // 購入完了ページへ遷移
      window.location.href = 'thanks.html?purchased=sample-a';
    }
  </script>
</body>
</html>
